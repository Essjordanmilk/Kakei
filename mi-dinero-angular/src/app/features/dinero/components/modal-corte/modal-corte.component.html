<app-modal [titulo]="titulo()" [hayCambios]="hayCambios()" (cerrar)="cerrar.emit()" (confirmar)="guardar()">
  <p class="fila-detalle mb-14">Mes: {{ mesActualTexto }}</p>

  <app-campo-monto etiqueta="Monto a pagar este corte" [(valor)]="monto" />

  <app-campo-fecha etiqueta="Fecha límite de pago" [opcional]="true" [(valor)]="fechaLimite" />
</app-modal>
