<app-modal [titulo]="titulo()" [hayCambios]="hayCambios()" (cerrar)="cerrar.emit()" (confirmar)="guardar()">
  <mat-form-field>
    <mat-label>Nombre</mat-label>
    <input matInput type="text" [(ngModel)]="nombre" placeholder="Ej: Préstamo carro" />
  </mat-form-field>

  <app-campo-monto etiqueta="Monto total" [(valor)]="montoTotal" />
  <app-campo-monto etiqueta="Pagado hasta ahora" [(valor)]="pagado" />

  <app-campo-monto etiqueta="Pago mensual planeado" [(valor)]="pagoMensual" />

  <p class="hint">Las tarjetas de crédito se registran como cuentas, en la pestaña Cuentas.</p>
</app-modal>
