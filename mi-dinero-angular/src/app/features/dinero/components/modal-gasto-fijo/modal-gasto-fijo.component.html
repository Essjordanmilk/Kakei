<app-modal [titulo]="titulo()" [hayCambios]="hayCambios()" (cerrar)="cerrar.emit()" (confirmar)="guardar()">
  <mat-form-field>
    <mat-label>Nombre</mat-label>
    <input matInput type="text" [(ngModel)]="nombre" placeholder="Ej: Arriendo" />
  </mat-form-field>

  <app-campo-monto etiqueta="Monto" [(valor)]="monto" />

  <app-selector-categoria tipo="GASTO" [(valor)]="categoria" />

  <app-selector-cuenta etiqueta="Se descuenta de" [(valor)]="cuentaId" />

  <mat-form-field>
    <mat-label>Día del mes en que se aplica</mat-label>
    <mat-select [value]="dia()" (selectionChange)="cambiarDia($event)">
      <mat-option [value]="null">Solo manual (lo marco yo)</mat-option>
      @for (dia of diasDelMes; track dia) {
        <mat-option [value]="dia">Día {{ dia }} de cada mes</mat-option>
      }
    </mat-select>
    <mat-hint>{{ ayudaDia() }}</mat-hint>
  </mat-form-field>
</app-modal>
