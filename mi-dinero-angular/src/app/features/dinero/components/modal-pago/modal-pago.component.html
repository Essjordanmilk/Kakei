<app-modal [titulo]="titulo()" textoConfirmar="Confirmar pago" [hayCambios]="hayCambios()" (cerrar)="cerrar.emit()"
  (confirmar)="confirmar()">
  <p class="fila-detalle mb-14">Saldo pendiente: <strong>{{ saldo() | moneda }}</strong></p>

  <app-campo-monto etiqueta="Monto a pagar" [(valor)]="monto" />

  <app-selector-cuenta etiqueta="Pagar desde" [(valor)]="cuentaOrigenId" />
</app-modal>
