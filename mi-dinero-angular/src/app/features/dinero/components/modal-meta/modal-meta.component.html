<app-modal [titulo]="titulo()" [hayCambios]="hayCambios()" (cerrar)="cerrar.emit()" (confirmar)="guardar()">
  <mat-form-field>
    <mat-label>Nombre</mat-label>
    <input matInput type="text" [(ngModel)]="nombre" placeholder="Ej: Fondo de emergencia" />
  </mat-form-field>

  <app-campo-monto etiqueta="Valor objetivo" [(valor)]="objetivo" />

  <app-campo-monto etiqueta="Valor ahorrado hasta ahora" [(valor)]="ahorrado" />

  <app-campo-fecha etiqueta="Fecha objetivo (opcional)" [opcional]="true" [minima]="hoy" [(valor)]="fecha" />
</app-modal>
