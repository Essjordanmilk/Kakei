<mat-form-field>
  <mat-label>{{ etiqueta() }}</mat-label>
  <mat-select [value]="valorCodificado()" (selectionChange)="cambiar($event)" panelClass="panel-selector">
    <mat-select-trigger>
      @if (grupoElegido(); as grupo) {
        <span class="opcion" [style.--color-categoria]="grupo.color">
          <fa-icon class="opcion-icono" [icon]="grupo.icono" />{{ etiquetaElegida() }}
        </span>
      }
    </mat-select-trigger>
    @for (grupo of grupos(); track grupo.id) {
      <mat-optgroup [label]="grupo.nombre">
        @for (opcion of grupo.opciones; track opcion.valor) {
          <mat-option [value]="opcion.valor">
            <span class="opcion" [style.--color-categoria]="grupo.color">
              <fa-icon class="opcion-icono" [icon]="grupo.icono" />{{ opcion.etiqueta }}
            </span>
          </mat-option>
        }
      </mat-optgroup>
    } @empty {
      <mat-option disabled>No hay categorías: créalas en la pestaña Presupuesto</mat-option>
    }
  </mat-select>
</mat-form-field>
