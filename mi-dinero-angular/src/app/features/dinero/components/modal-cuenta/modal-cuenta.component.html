<app-modal [titulo]="titulo()" [hayCambios]="hayCambios()" (cerrar)="cerrar.emit()" (confirmar)="guardar()">
  <mat-form-field>
    <mat-label>Nombre</mat-label>
    <input matInput type="text" [(ngModel)]="nombre" placeholder="Ej: Cuenta Débito, Nequi, Trii" />
  </mat-form-field>

  <app-toggle-opciones etiqueta="Tipo" [opciones]="tiposCuenta" [(valor)]="tipo" />

  <app-campo-monto
    [etiqueta]="esCredito() ? '¿Cuánto debes hoy en esta tarjeta?' : '¿Cuánto tienes hoy en esta cuenta?'"
    [(valor)]="cifra" />

  @if (esCredito()) {
    <div class="grid-2col">
      <mat-form-field>
        <mat-label>Día de corte</mat-label>
        <input matInput type="number" [(ngModel)]="diaCorte" min="1" max="31" placeholder="Ej: 15" inputmode="numeric" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Día límite de pago</mat-label>
        <input matInput type="number" [(ngModel)]="diaLimite" min="1" max="31" placeholder="Ej: 5" inputmode="numeric" />
      </mat-form-field>
    </div>
  }

  <app-selector-color etiqueta="Color" [permitirPersonalizado]="false" [valor]="claveColor()"
    (valorChange)="cambiarColor($event)" />
</app-modal>
