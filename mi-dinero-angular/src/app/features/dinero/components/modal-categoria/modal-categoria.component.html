<app-modal [titulo]="titulo()" [hayCambios]="hayCambios()" (cerrar)="cerrar.emit()" (confirmar)="guardar()">
  <div class="vista-previa" [style.--color-categoria]="colorCss()" aria-hidden="true">
    <span class="vista-previa-icono"><fa-icon [icon]="iconoVista()" /></span>
    <span class="vista-previa-nombre">{{ nombre() || 'Nueva categoría' }}</span>
  </div>

  <mat-form-field>
    <mat-label>Nombre</mat-label>
    <input matInput type="text" [ngModel]="nombre()" (ngModelChange)="cambiarNombre($event)"
      placeholder="Ej: Alimentación" />
  </mat-form-field>

  @if (conPresupuesto()) {
    <app-campo-monto etiqueta="Presupuesto mensual (opcional)" [(valor)]="presupuesto"
      ayuda="Déjalo en 0 si no quieres un límite para esta categoría" />
  }

  <app-selector-color etiqueta="Color" [(valor)]="color" />
  <app-selector-icono etiqueta="Icono" [color]="colorCss()" [(valor)]="icono" />
</app-modal>
