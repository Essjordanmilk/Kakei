<app-modal [titulo]="titulo()" textoConfirmar="Confirmar pago" [hayCambios]="hayCambios()" (cerrar)="cerrar.emit()" (confirmar)="confirmar()">
  <p class="fila-detalle mb-14">
    Deuda actual: <strong>{{ deuda() | moneda }}</strong>
    @if (montoCorte() > 0) {
      · Corte pendiente: <strong>{{ montoCorte() | moneda }}</strong>
    }
  </p>

  <app-campo-monto etiqueta="Monto a pagar" [(valor)]="monto" />

  <app-selector-cuenta etiqueta="Pagar desde" [excluir]="tarjeta().id" [(valor)]="cuentaOrigenId" />

  <p class="hint">Se registra como un traslado hacia la tarjeta: no cuenta como gasto del mes.</p>
</app-modal>
