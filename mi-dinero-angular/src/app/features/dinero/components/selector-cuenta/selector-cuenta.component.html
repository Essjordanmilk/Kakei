<mat-form-field>
  <mat-label>{{ etiqueta() }}</mat-label>
  <mat-select [value]="valor()" (selectionChange)="cambiar($event)" panelClass="panel-selector">
    <mat-select-trigger>
      @if (elegida(); as cuenta) {
        <span class="opcion" [style.--color-categoria]="cuenta.color">
          <fa-icon class="opcion-icono" [icon]="cuenta.icono" />{{ cuenta.nombre }}
        </span>
      }
    </mat-select-trigger>
    @for (opcion of opciones(); track opcion.id) {
      <mat-option [value]="opcion.id">
        <span class="opcion" [style.--color-categoria]="opcion.color">
          <fa-icon class="opcion-icono" [icon]="opcion.icono" />
          {{ opcion.nombre }}
          <span class="opcion-detalle">{{ opcion.tipo }}</span>
        </span>
      </mat-option>
    } @empty {
      <mat-option disabled>No hay cuentas: créalas en la pestaña Cuentas</mat-option>
    }
  </mat-select>
  @if (saldoElegida() !== null) {
    <mat-hint>Saldo actual: {{ saldoElegida() | moneda }}</mat-hint>
  }
</mat-form-field>
