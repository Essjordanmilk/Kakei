<form (ngSubmit)="enviar()" novalidate>
  <mat-form-field>
    <mat-label>Correo</mat-label>
    <input matInput type="email" [(ngModel)]="email" name="email" placeholder="tucorreo@ejemplo.com"
      autocomplete="email" inputmode="email" />
  </mat-form-field>

  <app-password-input etiqueta="Contraseña" [(valor)]="password" placeholder="Tu contraseña"
    autocomplete="current-password" />

  @if (error()) {
    <p class="mensaje-error" role="alert">{{ error() }}</p>
  }

  <button type="submit" class="btn-primario btn-bloque" [disabled]="enviando()">Entrar</button>
</form>
