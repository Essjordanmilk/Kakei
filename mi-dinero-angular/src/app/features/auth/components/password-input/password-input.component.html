<mat-form-field>
  <mat-label>{{ etiqueta() }}</mat-label>
  <input matInput #entrada [type]="visible() ? 'text' : 'password'" [value]="valor()"
    [placeholder]="placeholder()" [attr.autocomplete]="autocomplete()" [errorStateMatcher]="estadoError"
    (input)="valor.set(entrada.value)" (blur)="tocado.emit()" />
  <button matIconButton matSuffix type="button" [attr.aria-pressed]="visible()"
    [attr.aria-label]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'" (click)="alternarVisibilidad()">
    <fa-icon [icon]="visible() ? iconos.ocultar : iconos.mostrar" />
  </button>
  @if (error()) {
    <mat-error>{{ error() }}</mat-error>
  }
</mat-form-field>
