<fieldset class="campo">
  <legend class="campo-etiqueta">{{ etiqueta() }}</legend>
  <mat-button-toggle-group class="toggle" hideSingleSelectionIndicator [value]="valor()"
    [attr.aria-label]="etiqueta()" (change)="cambiar($event)">
    @for (opcion of opciones(); track opcion.valor) {
      <mat-button-toggle [value]="opcion.valor" [class]="'toggle-' + (opcion.variante ?? 'positivo')">
        {{ opcion.etiqueta }}
      </mat-button-toggle>
    }
  </mat-button-toggle-group>
</fieldset>
