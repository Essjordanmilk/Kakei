<header class="topbar">
  <a [routerLink]="rutaInicio" class="marca" [attr.aria-label]="nombreApp + ', ir al dashboard'">
    <span class="marca-logo" aria-hidden="true">{{ logo }}</span>
    <span class="marca-nombre">{{ nombreApp }}</span>
  </a>

  <div class="topbar-acciones">
    <!-- Acciones propias de la vista (p. ej. menú de respaldo) -->
    <ng-content />
    <app-boton-tema />
    <button type="button" class="btn-header btn-header-peligro" aria-label="Cerrar sesión" (click)="salir()">
      <fa-icon [icon]="iconos.salir" />
      <span class="btn-header-texto">Salir</span>
    </button>
  </div>
</header>
